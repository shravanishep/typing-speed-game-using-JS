<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
  

<!-- here will be container which eill show heading ,time,accuracy and text to write -->


<div class="container">

  <h1>😎Welcome To Typing Speed Game😎</h1>

  <div class="box1">
    <p>Here the text which you have to type will be shown to you:</p>

    <!-- Sentence to be typed -->
    <div class="box_textarea" id="displaytext"></div>

    <!-- Typing input area -->
    <textarea id="takinginput" placeholder="Start Writing Now...." ></textarea>
  </div>

  <div class="info">
    <p><strong>Time Left:</strong> <span id="timer">60</span>s</p>
    <p><strong>WPM:</strong> <span id="wpm">0</span></p>
    <p><strong>Accuracy:</strong> <span id="accuracy">100</span>%</p>
  </div>

  <button id="restartbtn">Restart😒..</button>

</div>







<script src="script.js"></script>


</body>
</html>
